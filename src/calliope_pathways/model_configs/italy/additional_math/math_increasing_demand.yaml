constraints:
  balance_demand:
    description: The electricity demand gradually increases to reach the 2050 electricity demand profile.
    foreach: [nodes, techs, carriers, timesteps, investsteps]
    where: base_tech=demand
    equations:
    - where: sink_use_equals
      expression: flow_in_inc_eff == sink_use_equals * demand_factor * $sink_scaler
    - where: NOT sink_use_equals AND sink_use_max
      expression: flow_in_inc_eff <= sink_use_max * $sink_scaler
    sub_expressions:
      sink_scaler:
      - where: sink_unit=per_area
        expression: area_use
      - where: sink_unit=per_cap
        expression: sum(flow_cap, over=carriers)
      - where: sink_unit=absolute
        expression: '1'