overrides:
  nuclear_initial_plants_scenario:
    nodes:
      NORD:
        techs:
          nuclear:
      CSUD:
        techs:
          nuclear:
    
    techs:
      nuclear:
        name: "Nuclear energy"
        color: '#5691bf'
        #color: '#4679a1'
        base_tech: supply
        inherit: cost_dim_setter
        carrier_out: electricity
        flow_cap_initial: 0 # kW
        source_unit: per_cap
        flow_out_eff: 0.35
        flow_ramping: 0.04
        
        # The technology is not likely to be available before 2035
        flow_cap_new_max:
          data: [0, 0, .inf, .inf, .inf, .inf]
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #data: [0, 0, .inf, .inf, .inf, .inf, .inf, .inf, .inf, .inf]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: vintagesteps

        capacity_factor_min: 0.70
        capacity_factor_max: 0.90
        lifetime: 50

        # CAPEX
        cost_flow_cap.data: 5200 # EUR2010/kW
        # OPEX
        cost_om_annual.data: 75.65 # EUR2010/kW/yr
        # Nuclear fuel cost
        cost_flow_in.data: 0.00816 # EUR2010/kWh

  emissions:
    # model.yaml
    #config:
    #  init:
    #    add_math: [../../math/pathways.yaml, additional_math/math.yaml, additional_math/math_emissions.yaml, additional_math/nuclear_specifications.yaml]

    parameters:
      objective_cost_weights:
        data: [1,0]
        index: [monetary, emissions]
        dims: costs

    # techs.yaml
    techs:
      waste:
        cost_flow_in:
          data:
            - -0.1305 # EUR2010/kWh
            - 0.32    # kgCO2/kWh
          index: [monetary, emissions]
      bioenergy:
        cost_flow_in:
          data:
            - 0.1367 # EUR2010/kWh
            - 0.29   # kgCO2/kWh
          index: [monetary, emissions]
      oil:
        cost_flow_in:
          data:
            - 0.01   # EUR2010/kWh
            - 0.24   # kgCO2/kWh
          index: [monetary, emissions]
      coal:
        cost_flow_in:
          data:
            - 0.00946 # EUR2010/kWh
            - 0.33    # kgCO2/kWh
          index: [monetary, emissions]
      ccgt:
        cost_flow_in:
          data:
            - 0.0291 # EUR2010/kWh
            - 0.18   # kgCO2/kWh
          index: [monetary, emissions]

  # Scenario 0
  emissions_scenario_0:
    parameters:
      emissions_cap:
          data: [.inf, .inf, .inf, .inf, .inf, .inf] # kgCO2
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          dims: investsteps

  # Scenario 1
  emissions_scenario_1:
    parameters:
      emissions_cap:
          data: [80.55e9, 56.88e9, 24.54e9, 6.92e9, 1.64e9, 0] # kgCO2
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          dims: investsteps

  # Scenario 2
  emissions_scenario_2:
    parameters:
      emissions_cap:
          data: [76.92e9, 44.24e9, 14.01e9, 3.13e9, 0.63e9, 0] # kgCO2
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          dims: investsteps

  # Scenario 3
  emissions_scenario_3:
    parameters:
      emissions_cap:
          data: [71.67e9, 31.60e9, 7.49e9, 1.39e9, 0.24e9, 0] # kgCO2
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #data: [71.67e9, 31.60e9, 7.49e9, 1.39e9, 0.24e9, 0, 0, 0, 0, 0]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: investsteps

  # Scenario 4
  emissions_scenario_4:
    parameters:
      emissions_cap:
          data: [64.12e9, 18.96e9, 3.06e9, 0.42e9, 0.06e9, 0] # kgCO2
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          dims: investsteps

  # Scenario 5
  emissions_scenario_5:
    parameters:
      emissions_cap:
          data: [54.53e9, 6.32e9, 0.38e9, 0.02e9, 0, 0] # kgCO2
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #data: [54.53e9, 6.32e9, 0.38e9, 0.02e9, 0, 0, 0, 0, 0, 0]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: investsteps

  increasing_demand:
    config:
      init:
        add_math: [../../math/pathways.yaml, additional_math/math.yaml, additional_math/math_emissions.yaml, additional_math/nuclear_specifications.yaml, additional_math/math_increasing_demand.yaml]

    techs:
      demand_electricity_2015:
        name: "Electricity demand in 2015"
        color: "#072486"
        base_tech: demand
        carrier_in: electricity
        flow_cap_initial: 1e12  # very large number - it doesn't actually matter what this technology has as a capacity.
        available_initial_cap: 1  # always available throughout the investment steps
        demand_factor:
          data: [0.9, 0.57, 0.22, 0.06, 0.01, 0]
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #data: [0.9, 0.57, 0.22, 0.06, 0.01, 0, 0, 0, 0, 0]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: investsteps

      demand_electricity_2050:
        name: "Electricity demand in 2050"
        color: "#072486"
        base_tech: demand
        carrier_in: electricity
        flow_cap_initial: 1e12  # very large number - it doesn't actually matter what this technology has as a capacity.
        available_initial_cap: 1  # always available throughout the investment steps
        demand_factor:
          data: [0.1, 0.43, 0.78, 0.94, 0.99, 1]
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #data: [0.1, 0.43, 0.78, 0.94, 0.99, 1, 1, 1, 1, 1]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: investsteps

    data_sources:
      # Demand data 2015
      electricity_demand_source_use_equals:
        add_dimensions:
          techs: demand_electricity_2015
          parameters: sink_use_equals

      # Demand data 2050
      electricity_demand_source_use_equals_2050:
        source: data_sources/timestep_series/demand_2050_eff.csv
        rows: timesteps
        columns: [nodes]
        add_dimensions:
          techs: demand_electricity_2050
          parameters: sink_use_equals

  import_export:
    nodes:
      NORD.techs:
        import_electricity:
          flow_cap_initial: 8400000
        export_electricity:
          flow_cap_initial: 8400000
      CNOR.techs:
        import_electricity:
        export_electricity:
      CSUD.techs:
        import_electricity:
        export_electricity:
      SUD.techs:
        import_electricity:
          flow_cap_initial: 500000
        export_electricity:
          flow_cap_initial: 500000
      SICI.techs:
        import_electricity:
        export_electricity:

    data_sources:
      available_initial_cap_import_export:
        source: data_sources/investstep_series/available_initial_cap_import_export.csv
        rows: [nodes]
        columns: investsteps
        add_dimensions:
          parameters: available_initial_cap
          techs: [import_electricity, export_electricity]

      available_vintages_import_export:
        source: data_sources/investstep_series/available_vintages_import_export.csv
        rows: [parameters]
        columns: [investsteps, vintagesteps]
        add_dimensions:
          techs: [import_electricity, export_electricity]
      
      data_flow_cap_new_bounding: 
        source: data_sources/flow_cap_new_bounding.csv
        rows: [nodes]
        columns: [vintagesteps]
        add_dimensions:
          parameters: [flow_cap_new_min, flow_cap_new_max]
          techs: [import_electricity]

      international_electricity_prices:
        source: data_sources/timestep_series/electricity_price_series.csv
        rows: timesteps
        columns: [license, reference, comment, techs]
        drop: [license, reference, comment]
        add_dimensions:
          costs: monetary
          parameters: cost_flow_out

  flow_cap_new_max_rate:
    techs: # Putting in some indicative values here - not based on any data source
      wind:
        flow_cap_new_max_rate:  # Putting in some indicative values here - not based on any data source
          #data: [2, 1.5, 1.5, 1, 1, 1]
          #data: [0.75, 1.5, 1.5, 1, 1, 1]
          data: [3, 3, 2, 1, 1, 1]
          #data: [3, 3, 3, 2, 2, 1]
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #data: [3, 3, 3, 2, 2, 1, 1, 1, 1, 1]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: investsteps
      pv:
        flow_cap_new_max_rate:  # Putting in some indicative values here - not based on any data source
          #data: [2, 1.5, 1.5, 1, 1, 1]
          #data: [0.75, 1.5, 1.5, 1, 1, 1]
          data: [3, 3, 2, 1, 1, 1]
          #data: [3, 3, 3, 2, 2, 1]
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #data: [3, 3, 3, 2, 2, 1, 1, 1, 1, 1]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: investsteps
      nuclear:
        flow_cap_new_max_rate:  # Putting in some indicative values here - not based on any data source
          data: [0, 0, .inf, 2, 2, 2]
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #data: [0, 0, .inf, 2, 2, 2, 2, 2, 2, 2]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: investsteps
      coal:
        flow_cap_new_max_rate:  # Putting in some indicative values here - not based on any data source
          data: 1
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: investsteps
      ccgt:
        flow_cap_new_max_rate:  # Putting in some indicative values here - not based on any data source
          data: 1
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: investsteps
      oil:
        flow_cap_new_max_rate:  # Putting in some indicative values here - not based on any data source
          data: 1
          index: [2025, 2030, 2035, 2040, 2045, 2050]
          #index: [2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070]
          dims: investsteps